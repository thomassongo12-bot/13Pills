<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - MediShop</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0066CC 0%, #00A651 100%); }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { display: flex; align-items: center; justify-content: center; }
    .login-logo h1 { font-size: 24px; font-weight: 800; color: #0066CC; margin-top: 8px; }
    .login-logo p { color: #718096; font-size: 14px; }
    .login-box .form-group { margin-bottom: 16px; }
    .login-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .login-box input { width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    .login-box input:focus { border-color: #0066CC; box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
    .login-btn { width: 100%; background: #0066CC; color: #fff; border: none; padding: 13px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .login-btn:hover { background: #0052a3; }
    .error-msg { background: #fff5f5; color: #c53030; padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; display: none; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #718096; font-size: 13px; }
    .back-link a { color: #0066CC; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
      </div>
      <h1>MediShop Admin</h1>
      <p>Connectez-vous à votre espace administrateur</p>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <div class="form-group">
      <label>Identifiant</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="login()" id="login-btn">Se connecter</button>
    <div class="back-link"><a href="/">← Back to site</a></div>
  </div>
<script>
  // If already logged in, redirect
  if (localStorage.getItem('admin_token')) {
    fetch('/api/auth/verify', { headers: { Authorization: `Bearer ${localStorage.getItem('admin_token')}` } })
      .then(r => r.json()).then(d => { if (d.valid) location.href = '/admin/'; });
  }

  document.getElementById('password').addEventListener('keypress', e => e.key === 'Enter' && login());

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');

    if (!username || !password) { showError('Veuillez remplir tous les champs'); return; }

    btn.disabled = true; btn.textContent = 'Connexion...';
    err.style.display = 'none';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));
        location.href = '/admin/';
      } else {
        showError(data.error || 'Identifiants incorrects');
        btn.disabled = false; btn.textContent = 'Se connecter';
      }
    } catch {
      showError('Erreur de connexion au serveur');
      btn.disabled = false; btn.textContent = 'Se connecter';
    }
  }

  function showError(msg) {
    const err = document.getElementById('error-msg');
    err.textContent = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>
