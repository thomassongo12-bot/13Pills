    <div class="admin-content">
      <div class="card">
        <div class="card-body" style="padding:0">
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Icône</th><th>Nom</th><th>Slug</th><th>Description</th><th>Produits</th><th>Actif</th><th>Actions</th></tr></thead>

<div class="modal-overlay" id="cat-modal">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <h2 id="modal-title">Ajouter une catégorie</h2>
      <button class="modal-close" onclick="closeModal('cat-modal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="cat-id">
      <div class="form-row">
        <div class="form-group"><label>Nom *</label><input type="text" id="c-name" placeholder="ex: Analgésiques"></div>
        <div class="form-group"><label>Icône (emoji)</label><input type="text" id="c-icon" placeholder="💊" maxlength="10"></div>
      </div>
      <div class="form-row one">
        <div class="form-group"><label>Description</label><textarea id="c-desc" rows="2" placeholder="Description de la catégorie..."></textarea></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Ordre d'affichage</label><input type="number" id="c-order" min="0" value="0"></div>
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-top:24px"><input type="checkbox" id="c-active" checked> Active</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('cat-modal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveCategory()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="admin-toast"></div>
<script src="/admin/admin-common.js"></script>
<script>
(async () => { if (!await requireAuth()) return; loadSidebarBranding(); loadCategories(); })();

async function loadCategories() {
  const cats = await fetch('/api/categories/all', { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  document.getElementById('cats-table').innerHTML = cats.length ? cats.map(c => `
    <tr>
      <td style="font-size:28px">${c.image_url || '📂'}</td>
      <td><strong>${c.name}</strong></td>
      <td><code style="font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px">${c.slug}</code></td>
      <td style="font-size:13px;color:#718096;max-width:200px">${c.description || '-'}</td>
      <td>${c.product_count || 0}</td>
      <td><label class="toggle"><input type="checkbox" ${c.is_active ? 'checked' : ''} onchange="toggleActive(${c.id},this.checked)"><span class="toggle-slider"></span></label></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="editCat(${c.id})">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCat(${c.id},'${c.name.replace(/'/g,"\\'")}')">🗑️</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="7" style="text-align:center;padding:30px;color:#718096">Aucune catégorie</td></tr>';
}

async function toggleActive(id, val) {
  await fetch(`/api/categories/${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ is_active: val ? 1 : 0 }) });
}

function openAddModal() {
  document.getElementById('modal-title').textContent = '➕ Ajouter une catégorie';
  document.getElementById('cat-id').value = '';
  document.getElementById('c-name').value = '';
  document.getElementById('c-icon').value = '';
  document.getElementById('c-desc').value = '';
  document.getElementById('c-order').value = 0;
  document.getElementById('c-active').checked = true;
  openModal('cat-modal');
}

let allCats = [];
async function editCat(id) {
  const cats = await fetch('/api/categories/all', { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  const c = cats.find(c => c.id === id);
  if (!c) return;
  document.getElementById('modal-title').textContent = '✏️ Modifier la catégorie';
  document.getElementById('cat-id').value = c.id;
  document.getElementById('c-name').value = c.name || '';
  document.getElementById('c-icon').value = c.image_url || '';
  document.getElementById('c-desc').value = c.description || '';
  document.getElementById('c-order').value = c.sort_order || 0;
  document.getElementById('c-active').checked = !!c.is_active;
  openModal('cat-modal');
}

async function saveCategory() {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { showToast('❌ Le nom est requis', 'error'); return; }
  const id = document.getElementById('cat-id').value;
  const payload = {
    name, image_url: document.getElementById('c-icon').value.trim(),
    description: document.getElementById('c-desc').value,
    sort_order: parseInt(document.getElementById('c-order').value) || 0,
    is_active: document.getElementById('c-active').checked ? 1 : 0
  };
  const url = id ? `/api/categories/${id}` : '/api/categories';
  const method = id ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(payload) });
  const data = await res.json();
  if (data.success !== false && !data.error) { closeModal('cat-modal'); showToast('✅ Catégorie enregistrée', 'success'); loadCategories(); }
  else showToast(`❌ ${data.error}`, 'error');
}

async function deleteCat(id, name) {
  if (!confirmDelete(`Supprimer "${name}" ?`)) return;
  const res = await fetch(`/api/categories/${id}`, { method: 'DELETE', headers: authHeaders() });
  const data = await res.json();
  if (data.success) { showToast('✅ Supprimé', 'success'); loadCategories(); }
  else showToast(`❌ ${data.error}`, 'error');
}
</script>
