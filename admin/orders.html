    <div class="admin-content">
      <div class="card">
        <div class="card-header">
          <div class="search-bar-admin" style="margin:0;flex:1">
            <input type="text" id="search" placeholder="N° commande, client, email..." oninput="loadOrders()">
            <select id="status-filter" onchange="loadOrders()">
              <option value="all">Tous les statuts</option>
              <option value="pending">En attente</option>
              <option value="processing">En cours</option>
              <option value="shipped">Expédié</option>
              <option value="delivered">Livré</option>
              <option value="cancelled">Annulé</option>
            </select>
          </div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="table-wrapper">
            <table>
              <thead><tr><th>N° Commande</th><th>Client</th><th>Produits</th><th>Total</th><th>Paiement</th><th>Statut</th><th>Date</th><th>Action</th></tr></thead>
              <tbody id="orders-table"></tbody>
            </table>
          </div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="order-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <h2 id="order-modal-title">Détail commande</h2>
      <button class="modal-close" onclick="closeModal('order-modal')">×</button>
    </div>
    <div class="modal-body" id="order-modal-body"></div>
    <div class="modal-footer">
      <select id="new-status">
        <option value="pending">En attente</option>
        <option value="processing">En cours</option>
        <option value="shipped">Expédié</option>
        <option value="delivered">Livré</option>
        <option value="cancelled">Annulé</option>
      </select>
      <button class="btn btn-primary" onclick="updateStatus()">Mettre à jour le statut</button>
      <button class="btn btn-outline" onclick="closeModal('order-modal')">Fermer</button>
    </div>
  </div>
</div>

<div class="toast" id="admin-toast"></div>
<script src="/admin/admin-common.js"></script>
<script>
let currentPage = 1, currentOrderId = null;
const urlParams = new URLSearchParams(location.search);

(async () => {
  if (!await requireAuth()) return;
  loadSidebarBranding();
  if (urlParams.get('status')) document.getElementById('status-filter').value = urlParams.get('status');
  loadOrders();
})();

async function loadOrders(page = 1) {
  currentPage = page;
  const search = document.getElementById('search').value;
  const status = document.getElementById('status-filter').value;
  const q = new URLSearchParams({ page, limit: 20 });
  if (search) q.set('search', search);
  if (status !== 'all') q.set('status', status);

  const data = await fetch(`/api/orders?${q}`, { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  const tbody = document.getElementById('orders-table');
  const payLabels = { cod: '💵 Contre-remb.', bank: '🏦 Virement' };

  tbody.innerHTML = data.orders.length ? data.orders.map(o => `
    <tr>
      <td><strong>${o.order_number}</strong></td>
      <td>${o.customer_name}<br><small style="color:#718096">${o.customer_email}</small></td>
      <td><small>${o.items.length} article(s)</small></td>
      <td><strong>${formatPrice(o.total)}</strong></td>
      <td><small>${payLabels[o.payment_method] || o.payment_method}</small></td>
      <td>${statusBadge(o.status)}</td>
      <td>${formatDate(o.created_at)}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="viewOrder(${o.id})">👁️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.id})">🗑️</button>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="8" style="text-align:center;padding:30px;color:#718096">Aucune commande</td></tr>';

  renderPagination('pagination', data.totalPages, page, 'loadOrders');
}

async function viewOrder(id) {
  currentOrderId = id;
  const o = await fetch(`/api/orders/${id}`, { headers: { Authorization: `Bearer ${getToken()}` } }).then(r => r.json());
  document.getElementById('order-modal-title').textContent = `Commande ${o.order_number}`;
  document.getElementById('new-status').value = o.status;

  const addr = typeof o.shipping_address === 'string' && o.shipping_address.startsWith('{')
    ? JSON.parse(o.shipping_address) : o.shipping_address;

  document.getElementById('order-modal-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div>
        <h3 style="font-size:14px;margin-bottom:8px;color:var(--primary)">👤 Client</h3>
        <p><strong>${o.customer_name}</strong></p>
        <p>${o.customer_email}</p>
        ${o.customer_phone ? `<p>${o.customer_phone}</p>` : ''}
      </div>
      <div>
        <h3 style="font-size:14px;margin-bottom:8px;color:var(--primary)">🚚 Livraison</h3>
        <p>${typeof addr === 'object' ? Object.values(addr).join(', ') : addr}</p>
      </div>
    </div>
    <h3 style="font-size:14px;margin-bottom:10px;color:var(--primary)">📦 Articles</h3>
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
      <tr style="background:var(--bg)"><th style="padding:8px;text-align:left;font-size:13px">Produit</th><th style="padding:8px;text-align:right;font-size:13px">Qté</th><th style="padding:8px;text-align:right;font-size:13px">Prix</th></tr>
      ${o.items.map(i => `<tr><td style="padding:8px;border-bottom:1px solid var(--border)">${i.name}</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">${i.quantity}</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">${formatPrice(i.price * i.quantity)}</td></tr>`).join('')}
    </table>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px">
      <span>Sous-total: <strong>${formatPrice(o.subtotal)}</strong></span>
      <span>Livraison: <strong>${o.shipping_cost === 0 ? 'Gratuit' : formatPrice(o.shipping_cost)}</strong></span>
      <span style="font-size:17px;color:var(--primary)">Total: <strong>${formatPrice(o.total)}</strong></span>
    </div>
    ${o.notes ? `<div style="margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px"><strong>Notes:</strong> ${o.notes}</div>` : ''}
  `;
  openModal('order-modal');
}

async function updateStatus() {
  const status = document.getElementById('new-status').value;
  const res = await fetch(`/api/orders/${currentOrderId}/status`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({ status }) });
  const data = await res.json();
  if (data.success) { showToast('✅ Statut mis à jour', 'success'); closeModal('order-modal'); loadOrders(currentPage); }
  else showToast('❌ Erreur', 'error');
}

async function deleteOrder(id) {
  if (!confirmDelete('Supprimer cette commande ?')) return;
  await fetch(`/api/orders/${id}`, { method: 'DELETE', headers: authHeaders() });
  showToast('✅ Commande supprimée', 'success');
  loadOrders(currentPage);
}
</script>
